<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <div class="mb-4">
        <h2 class="fw-bold">Các học phần đã đăng ký</h2>
        <p class="text-muted mb-0">Danh sách học phần của sinh viên đang đăng nhập</p>
    </div>

    <div class="card border-0 shadow rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Hình ảnh</th>
                        <th>Tên học phần</th>
                        <th>Số tín chỉ</th>
                        <th>Giảng viên</th>
                        <th>Ngày đăng ký</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(enrollments)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            Bạn chưa đăng ký học phần nào
                        </td>
                    </tr>

                    <tr th:each="enrollment, stat : ${enrollments}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <img th:src="${enrollment.course.image != null && !enrollment.course.image.isEmpty()} ? @{'/uploads/' + ${enrollment.course.image}} : 'https://via.placeholder.com/120x70?text=No+Image'"
                                 alt="Course image"
                                 style="width: 100px; height: 60px; object-fit: cover;"
                                 class="rounded">
                        </td>
                        <td th:text="${enrollment.course.name}">Tên học phần</td>
                        <td th:text="${enrollment.course.credits}">3</td>
                        <td th:text="${enrollment.course.lecturer}">Giảng viên</td>
                        <td th:text="${#temporals.format(enrollment.enrollDate, 'dd/MM/yyyy HH:mm')}">16/03/2026 10:30</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/home}" class="btn btn-secondary">← Quay lại trang chủ</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
