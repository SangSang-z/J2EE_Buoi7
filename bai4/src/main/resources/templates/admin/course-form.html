<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.id != null} ? 'Cập nhật học phần' : 'Thêm học phần'">Course Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-4"
                        th:text="${course.id != null} ? 'Cập nhật học phần' : 'Thêm học phần mới'">
                        Thêm học phần mới
                    </h2>

                    <form th:action="${course.id != null} ? @{/admin/courses/edit/{id}(id=${course.id})} : @{/admin/courses/create}"
                          th:object="${course}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Tên học phần</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số tín chỉ</label>
                                <input type="number" th:field="*{credits}" class="form-control" min="1" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Giảng viên</label>
                                <input type="text" th:field="*{lecturer}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Danh mục</label>
                            <select name="categoryId" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${course.category != null && course.category.id == cat.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3" th:if="${course.id != null and course.image != null and !course.image.isEmpty()}">
                            <label class="form-label">Ảnh hiện tại</label>
                            <div>
                                <img th:src="@{'/uploads/' + ${course.image}}"
                                     alt="Current image"
                                     class="img-fluid rounded border"
                                     style="max-width: 260px;">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Hình ảnh</label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*">
                            <div class="form-text">
                                Khi cập nhật, nếu chọn ảnh mới thì ảnh cũ sẽ được thay thế.
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${course.id != null} ? 'Cập nhật' : 'Thêm mới'">Thêm mới</span>
                            </button>
                            <a th:href="@{/admin/courses}" class="btn btn-secondary">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
