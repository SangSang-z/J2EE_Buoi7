<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Quản lý học phần</h2>
            <p class="text-muted mb-0">Danh sách học phần dành cho ADMIN</p>
        </div>
        <div class="mt-3 mt-md-0">
            <a th:href="@{/admin/courses/create}" class="btn btn-primary">+ Thêm học phần</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Tên học phần</th>
                        <th>Tín chỉ</th>
                        <th>Giảng viên</th>
                        <th>Danh mục</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${coursePage.totalElements == 0}">
                        <td colspan="7" class="text-center py-4 text-muted">Không có học phần nào</td>
                    </tr>

                    <tr th:each="course : ${coursePage.content}">
                        <td th:text="${course.id}">1</td>
                        <td>
                            <img th:src="${course.image != null && !course.image.isEmpty()} ? @{'/uploads/' + ${course.image}} : 'https://via.placeholder.com/120x70?text=No+Image'"
                                 alt="Course image"
                                 style="width: 100px; height: 60px; object-fit: cover;"
                                 class="rounded">
                        </td>
                        <td th:text="${course.name}">Java</td>
                        <td th:text="${course.credits}">3</td>
                        <td th:text="${course.lecturer}">Nguyễn Văn A</td>
                        <td th:text="${course.category != null ? course.category.name : 'Chưa có'}">CNTT</td>
                        <td class="text-center">
                            <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}" class="btn btn-warning btn-sm me-1">Edit</a>
                            <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Bạn có chắc muốn xóa học phần này?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-4" th:if="${coursePage.totalPages > 0}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${coursePage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/courses(page=${coursePage.number - 1}, keyword=${keyword})}">Previous</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}"
                th:classappend="${coursePage.number == i} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/courses(page=${i}, keyword=${keyword})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${coursePage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/courses(page=${coursePage.number + 1}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
