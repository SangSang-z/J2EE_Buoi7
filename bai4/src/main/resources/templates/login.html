<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-4">Đăng nhập</h2>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Sai username hoặc password
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success">
                        Bạn đã đăng xuất thành công
                    </div>

                    <div th:if="${success}" class="alert alert-success">
                        <span th:text="${success}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Login</button>
                    </form>
                    
                    <div class="text-center my-3 text-muted">hoặc</div>

                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100">
                        Login with Google
                    </a>

                    <p class="text-center mt-4 mb-0">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="fw-semibold text-decoration-none">Đăng ký ngay</a>
                    </p>


                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
