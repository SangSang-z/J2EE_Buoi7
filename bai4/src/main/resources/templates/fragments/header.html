<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" th:fragment="header">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">Course Registration</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <form class="d-flex ms-lg-4 my-3 my-lg-0 flex-grow-1" th:action="@{/home}" method="get">
                <input class="form-control me-2" type="search" name="keyword"
                       placeholder="Tìm kiếm học phần..."
                       th:value="${keyword}">
                <button class="btn btn-warning" type="submit">Search</button>
            </form>

            <ul class="navbar-nav ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">Home</a>
                </li>

                <li class="nav-item" th:if="${isStudent}">
                    <a class="nav-link" th:href="@{/my-courses}">My Courses</a>
                </li>

                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link" th:href="@{/admin/courses}">Manage Courses</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>

                <li class="nav-item" th:if="${!isAuthenticated}">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>

                <li class="nav-item dropdown" th:if="${isAuthenticated}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        Xin chào, <span th:text="${currentUsername}">user</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${isStudent}">
                            <a class="dropdown-item" th:href="@{/my-courses}">My Courses</a>
                        </li>
                        <li th:if="${isAdmin}">
                            <a class="dropdown-item" th:href="@{/admin/courses}">Manage Courses</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3">
                                <button type="submit" class="btn btn-danger btn-sm w-100">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
